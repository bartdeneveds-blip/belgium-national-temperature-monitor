name: Daily Belgian ERA5T update
on:
  schedule:
    - cron: "30 7 * * *"
  workflow_dispatch:
concurrency:
  group: daily-belgian-era5t
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v6
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements.txt
      - name: Configure CDS API
        env:
          CDS_API_URL: ${{ secrets.CDS_API_URL }}
          CDS_API_KEY: ${{ secrets.CDS_API_KEY }}
        run: |
          test -n "$CDS_API_URL" && test -n "$CDS_API_KEY"
          echo "url: $CDS_API_URL" > "$HOME/.cdsapirc"
          echo "key: $CDS_API_KEY" >> "$HOME/.cdsapirc"
      - name: Update latest available ERA5T days
        env:
          ERA5_LAG_DAYS: "5"
        run: python scripts/update_latest_era5t.py
      - run: python scripts/validate_output.py
      - run: |
          git config user.name "climate-data-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/belgium_national_temperature_anomaly_era5t.csv
          git commit -m "Update Belgian ERA5T anomalies" || exit 0
          git pull --rebase
          git push
