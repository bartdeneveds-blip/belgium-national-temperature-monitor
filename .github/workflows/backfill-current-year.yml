name: Backfill Belgian ERA5T year
on:
  workflow_dispatch:
    inputs:
      year:
        description: Year to backfill
        required: true
        default: "2026"
permissions:
  contents: write
jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v5
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v6
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements.txt
      - name: Configure CDS API
        env:
          CDS_API_URL: ${{ secrets.CDS_API_URL }}
          CDS_API_KEY: ${{ secrets.CDS_API_KEY }}
        run: |
          test -n "$CDS_API_URL" && test -n "$CDS_API_KEY"
          echo "url: $CDS_API_URL" > "$HOME/.cdsapirc"
          echo "key: $CDS_API_KEY" >> "$HOME/.cdsapirc"
      - name: Backfill missing days
        env:
          DATA_YEAR: ${{ inputs.year }}
          ERA5_LAG_DAYS: "5"
        run: python scripts/update_latest_era5t.py
      - run: python scripts/validate_output.py
      - run: |
          git config user.name "climate-data-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/belgium_national_temperature_anomaly_era5t.csv
          git commit -m "Backfill Belgian ERA5T anomalies" || exit 0
          git pull --rebase
          git push
