name: Prepare Belgian ERA5 grid mask
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v6
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements.txt
      - run: python scripts/prepare_grid.py
      - run: |
          git config user.name "climate-data-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/belgium_boundary.geojson data/belgium_era5_grid_weights.csv
          git commit -m "Prepare Belgian ERA5 grid mask" || exit 0
          git pull --rebase
          git push
